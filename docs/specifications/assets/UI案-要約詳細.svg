<rect x="568" y="138" width="824" height="1" fill="#E4DFD4"/><rect x="568" y="136" width="30" height="3" class="g"/>

<!-- 注意書き -->
<rect x="568" y="158" width="824" height="48" rx="10" fill="#FFF6DC" stroke="#EBD28A"/>
<path class="ic" stroke="#5E4300" transform="translate(584 172) scale(0.75)" d="M12 3l10 18H2zM12 10v5M12 18h.01"/>
<text x="614" y="187" class="s" style="fill:#5E4300;font-size:13px">編集中です。保存すると手編集済みになり、自動更新から保護されます。保存後に検索データも更新します。</text>

<!-- 本文 -->
<text x="568" y="238" class="s m b">要約本文</text>
<rect x="568" y="248" width="824" height="290" rx="12" class="in" stroke="#0E6A62" stroke-width="2"/>
<text x="590" y="292" font-size="15">SQLite へのデータ移行の手順について、バックアップを取ってから段階的に進める方針で話がまとまった。</text>
<text x="590" y="348" font-size="15">検索用のデータは要約本文から作り直せるため、移行後に再生成する流れが共有された。</text>
<text x="590" y="404" font-size="15">（サンプル本文）</text>

<!-- タグ・戻す -->
