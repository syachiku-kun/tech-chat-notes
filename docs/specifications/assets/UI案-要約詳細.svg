<text x="280" y="56" class="s a">← 本棚</text><text x="334" y="56" class="s m">/</text>
<text x="348" y="56" class="s m">個人開発もくもく会</text><text x="452" y="56" class="s m">/</text><text x="466" y="56" class="s">11/16 午前</text>

<!-- 表紙とメタ -->
<rect x="280" y="92" width="248" height="330" rx="12" fill="#0E6A62"/><rect x="280" y="92" width="10" height="330" rx="4" fill="#000000" opacity="0.2"/>
<text x="312" y="128" class="w">個人開発もくもく会</text>
<text x="312" y="278" class="k w" font-size="64">11/16</text>
<rect x="312" y="382" width="52" height="24" rx="12" fill="#FFFFFF" opacity="0.2"/><text x="338" y="399" class="s w c" font-size="13">午前</text>
<text x="506" y="399" class="w e" font-size="13">83件</text>
<text x="280" y="462" class="s m">対象時間</text><text x="376" y="462" class="s">0:00〜12:00</text>
