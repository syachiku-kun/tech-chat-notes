<rect x="1216" y="552" width="176" height="40" rx="10" class="in"/>
<path class="ic" transform="translate(1230 562) scale(0.7)" d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/><text x="1252" y="577">AI の要約に戻す</text>

<!-- 操作 -->
