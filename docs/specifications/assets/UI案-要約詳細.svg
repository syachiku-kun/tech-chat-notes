<rect x="712" y="636" width="104" height="44" rx="10" class="in"/><text x="764" y="663" class="c">キャンセル</text>
<rect x="1128" y="636" width="96" height="44" rx="10" class="in"/><text x="1176" y="663" class="c">再要約…</text>
<text x="1392" y="663" class="r e">この要約を削除</text>
