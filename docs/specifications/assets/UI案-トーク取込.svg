<rect x="1072" y="208" width="300" height="1" fill="#EFEBE2"/>
<circle cx="1082" cy="236" r="5" fill="#1F8A5B"/><text x="1100" y="234" font-size="13" font-weight="500">Python 学習部屋</text><text x="1100" y="254" class="s m">11/16 08:42 · 612行 取込</text>
<rect x="1072" y="268" width="300" height="1" fill="#EFEBE2"/>
<circle cx="1082" cy="296" r="5" fill="#1F8A5B"/><text x="1100" y="294" font-size="13" font-weight="500">AI ツール情報交換</text><text x="1100" y="314" class="s m">11/15 20:31 · 804行 取込</text>
<rect x="1072" y="328" width="300" height="1" fill="#EFEBE2"/>
<circle cx="1082" cy="356" r="5" fill="#1F8A5B"/><text x="1100" y="354" font-size="13" font-weight="500">個人開発もくもく会</text><text x="1100" y="374" class="s m">11/14 07:55 · 1,020行 取込</text>
<rect x="1072" y="388" width="300" height="1" fill="#EFEBE2"/>
<circle cx="1082" cy="416" r="5" fill="#B3261E"/><text x="1100" y="414" font-size="13" font-weight="500">Python 学習部屋</text><text x="1100" y="434" class="s m">11/13 21:03 · 取込に失敗</text>
